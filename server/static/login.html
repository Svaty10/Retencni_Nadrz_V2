<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Přihlášení | Retenční Nádrž</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/theme.js"></script>
</head>
<body class="auth-body">
    <div class="login-box">
        <div class="auth-brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c-3 3.6-6 7.3-6 10.5a6 6 0 0 0 12 0c0-3.2-3-6.9-6-10.5z"/></svg>Retenční nádrž</div>
        <h1>Přihlášení</h1>
        <div id="firstInfo" class="info hidden">
            <strong>První přihlášení</strong><br>
            Jméno <code>admin</code> a heslo ze štítku zařízení. Poté si vytvoříte vlastní účet
            a výchozí přístup se zruší.
        </div>
        <div id="err" class="alert hidden" role="alert"></div>
        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="username">Uživatelské jméno</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" maxlength="32">
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="256">
            </div>
            <button type="submit" id="btn">Přihlásit se</button>
        </form>
        <p class="login-cert small hidden" id="certHint">
            <a href="/ca.crt" download>Stáhnout certifikát hubu</a><br>
            <span class="muted">Nainstalujte ho jednou do zařízení a hub se pak otevře přes zabezpečené https:// bez varování.</span>
        </p>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
