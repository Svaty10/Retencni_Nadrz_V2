<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Vlastní účet | Retenční Nádrž</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/theme.js"></script>
</head>
<body class="auth-body">
    <div class="login-box">
        <div class="auth-brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c-3 3.6-6 7.3-6 10.5a6 6 0 0 0 12 0c0-3.2-3-6.9-6-10.5z"/></svg>Retenční nádrž</div>
        <h1>Vytvořte si účet</h1>
        <p>Výchozí účet <code>admin</code> s heslem ze štítku slouží jen k prvnímu přihlášení.
           Po vytvoření vlastního účtu bude zrušen.</p>
        <div id="err" class="alert hidden" role="alert"></div>
        <form id="setupForm">
            <div class="form-group">
                <label for="username">Vaše uživatelské jméno</label>
                <input type="text" id="username" required autocomplete="username" maxlength="32" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Nové heslo (min. 10 znaků)</label>
                <input type="password" id="password" required minlength="10" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password2">Heslo znovu</label>
                <input type="password" id="password2" required minlength="10" autocomplete="new-password">
            </div>
            <button type="submit" id="btn">Vytvořit účet a pokračovat</button>
        </form>
    </div>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
