# =============================================================================
# Home Assistant – Retenční nádrž (integrace REST, 1 dotaz za minutu -> všechny entity)
#
# 1) secrets.yaml:   retencka_auth: "Bearer <token z Nastavení -> Home Assistant>"
# 2) níže upravte adresu (retencka-xxxx.local nebo IP; port 8081 = jen místní síť)
# 3) Nastavení -> Systém -> Restartovat
#
# Hotový YAML včetně správné adresy a VŠECH čidel vygeneruje web: Nastavení -> Home Assistant.
# Další čidla: stejný blok s ?node=<ID> a jinými názvy (např. "Retencka jimka hladina").
# Vzniknou entity: sensor.retencka_hladina, sensor.retencka_teplota,
# sensor.retencka_vlhkost, sensor.retencka_baterie (+ objem, cm, napětí, signál, stav)
# =============================================================================
rest:
  - resource: http://retencka.local:8081/api/v1/water/state   # první čidlo (nebo ?node=<ID>)
    headers:
      Authorization: !secret retencka_auth
    scan_interval: 60
    timeout: 10
    sensor:
      - name: "Retencka hladina"
        unique_id: retencka_hladina
        value_template: "{{ value_json.water_level_percent }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka hladina cm"
        unique_id: retencka_hladina_cm
        value_template: "{{ value_json.water_level_cm }}"
        unit_of_measurement: "cm"
        device_class: distance
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka objem"
        unique_id: retencka_objem
        value_template: "{{ value_json.volume_liters }}"
        unit_of_measurement: "L"
        device_class: volume_storage
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka teplota"
        unique_id: retencka_teplota
        value_template: "{{ value_json.temperature }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka vlhkost"
        unique_id: retencka_vlhkost
        value_template: "{{ value_json.humidity }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka baterie"
        unique_id: retencka_baterie
        value_template: "{{ value_json.battery_percent }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka baterie napeti"
        unique_id: retencka_baterie_napeti
        value_template: "{{ value_json.battery_voltage }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka signal"
        unique_id: retencka_signal
        value_template: "{{ value_json.rssi }}"
        unit_of_measurement: "dBm"
        device_class: signal_strength
        state_class: measurement
        entity_category: diagnostic
        availability: "{{ value_json is defined and value_json.status != 'offline' }}"
      - name: "Retencka stav"
        unique_id: retencka_stav
        value_template: "{{ value_json.status }}"
        icon: mdi:access-point
    binary_sensor:
      - name: "Retencka baterie slaba"
        unique_id: retencka_baterie_slaba
        value_template: "{{ value_json.battery_low }}"
        device_class: battery
      - name: "Retencka dopousti"
        unique_id: retencka_dopousti
        value_template: "{{ value_json.is_refilling }}"
        device_class: running
